[project]
name = "svg-darkmode"
version = "1.0.0"
description = "Add css style to invert colours based on prefers-color-scheme"
authors = [{ name = "Martijn Bonajo", email = "m.bonajo@fontys.nl" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prepare-toolbox>=1.0.1",
    "beautifulsoup4>=4.12.2",
    "lxml>=6.1.0",
    "cssutils>=2.9.0",
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.12.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
    "packaging>=26.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
