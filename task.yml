id: "svg-darkmode"
name: "SVG darkmode"
description: "Add dark mode (invert colours) to SVG using CSS"
inputs:
  inputs:
    description: "SVG files to convert"
    required: true
    type: array
    items: string
  excluded:
    description: "Glob(s) to exclude from matching the inputs"
    required: false
    type: array
    items: string
  include-hidden:
    description: "Also match hidden files and directories (starting with a '.') with wildcards such as '*' and '**', for both inputs and excluded"
    required: false
    type: boolean
    default: false
outputs:
  files:
    description: The SVG files that have been converted
    type: array
    items: string
runs:
  using: "python"
  main: "prepare_svg_darkmode/main.py"